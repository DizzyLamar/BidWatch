name: BidWatch Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  APPDEPLOY_APP_ID: bidwatch-q2u0th
  APPDEPLOY_APP_URL: https://bidwatch-q2u0th.v2.appdeploy.ai/

concurrency:
  group: bidwatch-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://bidwatch-q2u0th.v2.appdeploy.ai/
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Repository verification
        run: npm test

      - name: Validate deployment script
        run: node --check scripts/deploy-appdeploy.mjs

      - name: Deploy through AppDeploy
        env:
          APPDEPLOY_API_KEY: ${{ secrets.APPDEPLOY_API_KEY }}
        run: node scripts/deploy-appdeploy.mjs
