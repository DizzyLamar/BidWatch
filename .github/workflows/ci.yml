name: BidWatch CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: bidwatch-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Repository tests and security/UX checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Repository verification
        run: npm test

      - name: Validate automation scripts
        run: node --check scripts/verify-repo.mjs

  tenant-integration:
    name: Local Supabase tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select isolated local service ports
        run: |
          echo "SUPABASE_DB_PORT=$((55000 + GITHUB_RUN_NUMBER % 1000))" >> "$GITHUB_ENV"
          echo "BROWSER_TEST_PORT=$((4173 + GITHUB_RUN_NUMBER % 1000))" >> "$GITHUB_ENV"

      - name: Start local Supabase (Auth, PostgREST, Database and Storage)
        run: npx supabase start --exclude realtime,imgproxy,studio,edge-runtime,analytics,vector,supavisor

      - name: Run real Auth and PostgREST integration tests
        shell: bash
        run: |
          set -euo pipefail
          eval "$(npx supabase status -o env)"
          export SUPABASE_URL="$API_URL"
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SECRET_KEY="$SERVICE_ROLE_KEY"
          export VITE_SUPABASE_URL="$API_URL"
          export VITE_SUPABASE_PUBLISHABLE_KEY="$ANON_KEY"
          export BROWSER_TEST_PORT="$BROWSER_TEST_PORT"
          npm run build
          export LOCAL_SUPABASE_URL="$API_URL"
          export LOCAL_SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export PHASE2B_DRY_RUN=1
          export PHASE2B_REPORT_PATH="artifacts/phase-2b-ci-dry-run.json"
          npm run phase2b:dry-run
          test -s "$PHASE2B_REPORT_PATH"
          export PHASE2B_BACKFILL=1
          export PHASE2B_BACKFILL_CONFIRM="REVIEWED_LOCAL_DRY_RUN"
          export PHASE2B_RUN_ID="00000000-0000-4000-8000-000000000002"
          export PHASE2B_BACKFILL_RECORD_IDS=""
          export PHASE2B_BACKFILL_REPORT_PATH="artifacts/phase-2b-ci-backfill.json"
          npm run phase2b:backfill
          test -s "$PHASE2B_BACKFILL_REPORT_PATH"
          npm run test:integration
          npx tsx scripts/migrate-legacy-attachments.ts
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          npm run test:browser

      - name: Stop local Supabase
        if: always()
        run: npx supabase stop

  deploy:
    name: Deploy to Render
    needs: [verify, tenant-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message != 'Complete Phase 2B resumable legacy backfill' && github.event.head_commit.message != 'Pause deployment for Phase 2B merge safety' && github.event.head_commit.message != 'Fix Phase 2B source-run access-method allowlist'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -e
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --request POST --output /tmp/render-deploy.json "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deploy hook response:"
          cat /tmp/render-deploy.json

      - name: Wait for the expected Render build
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          RENDER_APP_URL: https://bidwatch-gk3r.onrender.com
        run: |
          set -e
          HEALTH_URL="${RENDER_APP_URL%/}/healthz"
          echo "Waiting for Render to serve commit $EXPECTED_COMMIT"
          echo "Resolving ${RENDER_APP_URL#https://}:"
          getent hosts "${RENDER_APP_URL#https://}" || true

          for i in {1..90}; do
            status=$(curl --silent --show-error --output /tmp/health.json --write-out "%{http_code}" --max-time 10 "$HEALTH_URL" || true)
            body=$(cat /tmp/health.json 2>/dev/null || true)

            if printf '%s' "$body" | grep -qi 'Service Suspended'; then
              echo "Render reports the service is suspended."
              echo "$body"
              echo "The deploy hook was accepted, but Render has not made the service available."
              exit 1
            fi

            if [ "$status" = "200" ]; then
              echo "Render health response: $body"
              build=$(printf '%s' "$body" | node -e 'let s=""; process.stdin.on("data",d=>s+=d); process.stdin.on("end",()=>{try{process.stdout.write(String(JSON.parse(s).build || ""))}catch{process.stdout.write("")}})' 2>/dev/null || true)
              build=$(printf '%s' "$build" | tr -d '\r\n')

              if [ "$build" = "$EXPECTED_COMMIT" ]; then
                echo "Render is healthy and serving the expected commit."
                exit 0
              fi

              echo "Render is healthy, but still serving build '$build' (expected '$EXPECTED_COMMIT')."
            else
              echo "Render not ready yet (HTTP $status), attempt $i/90"
            fi

            sleep 10
          done

          echo "Render did not become healthy on the expected commit within 15 minutes."
          echo "Final health response:"
          cat /tmp/health.json 2>/dev/null || true
          exit 1
