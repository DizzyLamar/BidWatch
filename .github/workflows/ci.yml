name: BidWatch CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Repository tests and security/UX checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Repository verification
        run: npm test

      - name: Validate automation scripts
        run: node --check scripts/verify-repo.mjs

  deploy:
    name: Deploy to Render
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Wait for Render health check
        run: |
          set -e
          for i in {1..48}; do
            status=$(curl --silent --show-error --output /tmp/health.json --write-out "%{http_code}" --max-time 10 https://bidwatch.onrender.com/healthz || true)
            if [ "$status" = "200" ]; then
              echo "Render is healthy: $(cat /tmp/health.json)"
              exit 0
            fi
            echo "Render not ready yet (HTTP $status), attempt $i/48"
            sleep 10
          done
          echo "Render did not become healthy within 8 minutes."
          exit 1
