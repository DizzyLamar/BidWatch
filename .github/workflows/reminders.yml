name: BidWatch reminders

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

jobs:
  reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Run daily reminder job
        env:
          BIDWATCH_URL: ${{ secrets.BIDWATCH_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$BIDWATCH_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            -X POST "$BIDWATCH_URL/api/internal/reminders" \
            -H "X-Cron-Secret: $CRON_SECRET"
